# Copiar a /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |
    service:
      type: NodePort
    ports:
      web:
        nodePort: 30080
      websecure:
        nodePort: 30443
        forwardedHeaders:
          trustedIPs:
          - 127.0.0.1/32
          - 10.42.0.0/16
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 192Mi
