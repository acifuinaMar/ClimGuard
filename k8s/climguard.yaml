    contentTypeNosniff: true
    frameDeny: false
    customFrameOptionsValue: SAMEORIGIN
    referrerPolicy: strict-origin-when-cross-origin
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: climguard
  namespace: climguard
  labels:
    app.kubernetes.io/part-of: climguard
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: climguard-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - climguard.acifuina.online
    secretName: climguard-tls
  rules:
  - host: climguard.acifuina.online
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 8080
      - path: /hubs
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
