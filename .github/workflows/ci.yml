# ClimGuard 4.1 — integración continua.
# Compila y prueba todos los servicios y el frontend, valida Docker Compose y los manifiestos de K3s
# y busca secretos. No usa credenciales de producción, no accede a la VPS y NO despliega.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/climguard-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/climguard-web/package-lock.json
      - run: npm ci
      - name: Pruebas unitarias (Karma, Chrome headless)
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Build de producción
        run: npx ng build --configuration production

  auth:
    name: auth-service (NestJS)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/auth } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/auth/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Pruebas (JWT, contraseñas, contrato de login, OAuth)
        run: npm test

  python:
    name: ${{ matrix.service }}-service (FastAPI)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [report, audit]
    defaults: { run: { working-directory: "services/${{ matrix.service }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "services/${{ matrix.service }}/requirements.txt"
      - run: pip install -r requirements.txt
      - name: Pruebas unitarias
        run: python -m unittest discover -s tests -t . -v

  alert:
    name: alert-service (Spring Boot)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/alert } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Evaluador de reglas (autoprueba)
        run: |
          mkdir -p /tmp/alert-test
          javac -d /tmp/alert-test src/main/java/com/climguard/alert/RuleEvaluator.java src/test/java/com/climguard/alert/RuleEvaluatorSelfTest.java
          java -cp /tmp/alert-test com.climguard.alert.RuleEvaluatorSelfTest | tail -1
      - name: Build (Maven)
        run: mvn -B -q package -DskipTests

  dotnet:
    name: ${{ matrix.service }} (.NET 10)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, community, sensor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build "services/${{ matrix.service }}" -c Release -nologo

  infra:
    name: Compose y manifiestos K3s
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Sintaxis de scripts
        run: for f in scripts/*.sh docker/postgres/init.sh; do bash -n "$f"; done
      - name: El generador reproduce los manifiestos versionados
        run: |
          python scripts/gen-k8s.py
          git diff --exit-code -- k8s/
      - name: Los manifiestos no contienen Secrets
        run: |
          python - <<'EOF'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("k8s/climguard.yaml", encoding="utf-8")) if d]
          kinds = [d["kind"] for d in docs]
          assert "Secret" not in kinds, "k8s/climguard.yaml no debe contener Secrets"
          print(len(docs), "recursos:", sorted(set(kinds)))
          EOF
      - name: Esquema de Kubernetes (kubeconform)
        # Valida contra los esquemas oficiales de Kubernetes; los CRD de Traefik y de K3s
        # (Middleware, HelmChartConfig) no tienen esquema público y se omiten.
        run: |
          docker run --rm -v "$PWD/k8s:/k8s:ro" "ghcr.io/yannh/kubeconform:${KUBECONFORM_VERSION}" \
            -strict -summary -ignore-missing-schemas /k8s/climguard.yaml /k8s/traefik-config.yaml
      - name: Docker Compose (con un .env de prueba generado al vuelo)
        run: |
          bash scripts/gen-env.sh   # los .sh se versionan sin permiso de ejecución
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.oauth.yml config -q
          rm -f .env

  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v4
      - name: Instalar gitleaks (versión fija y suma de verificación)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      # Se analiza el árbol actual. El historial contiene credenciales de la Fase 2 ya documentadas
      # (docs/riesgos-y-pendientes.md, S3); limpiarlo exigiría reescribir la historia.
      - name: Analizar el árbol de trabajo
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1
