# =====================================================================
#  ClimGuard — orquestación de contenedores
# =====================================================================
#  Hoy (Día 1) solo levantamos SQL Server, que es contra lo que vamos a
#  programar. El jueves se le suman los servicios "api" y "frontend".
#
#  Uso:
#     docker compose up -d sqlserver     (levantar solo la base)
#     docker compose logs -f sqlserver   (ver qué está haciendo)
#     docker compose down                (apagar, conservando los datos)
#     docker compose down -v             (apagar y BORRAR los datos)
# =====================================================================

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: climguard-sqlserver

    environment:
      # Aceptar la licencia de SQL Server. Sin esto el contenedor no arranca.
      ACCEPT_EULA: "Y"
      # La contraseña sale del archivo .env, NUNCA escrita aquí.
      # Si .env no existe, docker compose avisa y no arranca: eso es bueno.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?falta MSSQL_SA_PASSWORD en el archivo .env}
      # Developer: gratuita, con todas las funciones. No apta para producción.
      MSSQL_PID: "Developer"

    ports:
      # "izquierda:derecha" = "puerto de tu Windows : puerto dentro del contenedor"
      # Así te puedes conectar desde tu máquina a localhost,1433
      - "1433:1433"

    volumes:
      # Sin esto, al borrar el contenedor perderías toda la base de datos.
      # Un volumen con nombre sobrevive a docker compose down.
      - climguard-sqldata:/var/opt/mssql

    healthcheck:
      # Docker pregunta cada 10s "¿ya puedes responder consultas?".
      # -C = confiar en el certificado autofirmado del contenedor.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      # SQL Server tarda en el primer arranque; no lo marcamos caído mientras tanto.
      start_period: 45s

    restart: unless-stopped

volumes:
  climguard-sqldata:
    name: climguard-sqldata
