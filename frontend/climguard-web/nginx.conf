# =====================================================================
#  Configuración de nginx para servir la aplicación Angular
# =====================================================================

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---- EL AJUSTE MÁS IMPORTANTE PARA ANGULAR ----
    #
    # En una aplicación de una sola página, rutas como /sensores o /login
    # NO son archivos reales en el disco: las inventa Angular en el navegador.
    #
    # Si el usuario recarga estando en /sensores, nginx busca un archivo
    # "sensores" que no existe y devolvería un 404.
    #
    # try_files le dice: "busca el archivo; si no lo encuentras, entrega
    # index.html y deja que Angular resuelva la ruta". Sin esto, recargar
    # cualquier pantalla que no sea la principal da error.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- REENVÍO AL BACKEND (reverse proxy) ----
    #
    # Cuando el navegador pide /api/algo, nginx lo reenvía al contenedor
    # de la API (que en la red de Docker se llama "api").
    #
    # La ventaja: el navegador solo habla con UNA dirección (la del frontend),
    # así que NO hay petición "de origen cruzado" y CORS deja de ser un
    # problema. Es la forma más limpia de conectar los contenedores.
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Estas dos líneas dejan pasar los WebSockets, que SignalR necesita.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # Los archivos con huella (main-XXXX.js) nunca cambian su contenido,
    # así que el navegador puede guardarlos en caché para siempre.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cabeceras de seguridad básicas (criterio de seguridad del enunciado).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Comprimir texto para que cargue más rápido.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
