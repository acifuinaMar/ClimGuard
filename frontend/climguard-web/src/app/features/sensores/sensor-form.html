<!-- La capa oscura de fondo. Al hacer clic en ella se cierra, que es lo que
     todo el mundo espera de una ventana modal. -->
<div class="fondo" (click)="cancelar.emit()">

  <!-- $event.stopPropagation() evita que el clic DENTRO de la ventana
       llegue al fondo y la cierre por accidente. -->
  <div class="modal" (click)="$event.stopPropagation()">

    <header class="modal__cabecera">
      <h2>{{ titulo() }}</h2>
      <button type="button" class="modal__cerrar"
              (click)="cancelar.emit()" aria-label="Cerrar">✕</button>
    </header>

    <form [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>

      <div class="campo">
        <label for="nombre">Nombre del sensor</label>
        <input id="nombre" type="text" formControlName="nombre"
               placeholder="Ej.: Termómetro Norte"
               [class.malo]="nombre.invalid && nombre.touched">
        @if (nombre.touched && nombre.hasError('required')) {
          <span class="error">El nombre es obligatorio.</span>
        } @else if (nombre.touched && nombre.hasError('minlength')) {
          <span class="error">Debe tener al menos 3 caracteres.</span>
        }
      </div>

      <div class="fila">
        <div class="campo">
          <label for="tipo">Variable que mide</label>
          <select id="tipo" formControlName="tipoSensorId">
            @for (t of tipos; track t.id) {
              <option [value]="t.id">{{ t.nombre }}</option>
            }
          </select>
        </div>

        <div class="campo">
          <label for="comunidad">Comunidad</label>
          <input id="comunidad" type="number" min="1" formControlName="comunidadId">
        </div>
      </div>

      <div class="campo">
        <label for="valor">Valor actual</label>
        <input id="valor" type="number" step="0.1" formControlName="valorActual">
        <span class="ayuda">Es la lectura simulada del sensor en este momento.</span>
      </div>

      <label class="interruptor">
        <input type="checkbox" formControlName="activo">
        <span>Sensor activo</span>
      </label>
      <span class="ayuda ayuda--suelta">Un sensor inactivo no genera lecturas nuevas.</span>

      <footer class="modal__pie">
        <button type="button" class="btn btn--claro"
                (click)="cancelar.emit()" [disabled]="guardando()">Cancelar</button>
        <button type="submit" class="btn btn--primario" [disabled]="guardando()">
          @if (guardando()) { Guardando… } @else { Guardar }
        </button>
      </footer>

    </form>
  </div>
</div>
